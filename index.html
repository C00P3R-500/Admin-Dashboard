<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <div class="sidebar-container"> 
            <div class="sidebar-head-box">
                <img class="head-img" src="./icons/application.svg" alt="Application Icon">
                <div class="sidebar-heading">Dashboard</div>
            </div>
            <div class="sidebar-box">
                <img class="icon-img" src="./icons/home.svg" alt="Home Icon">
                <div class="sidebar-label">Home</div>
            </div>
            <div class="sidebar-box">
                <img class="icon-img" src="./icons/profile.svg" alt="Home Icon">
                <div class="sidebar-label">Profile</div>
            </div>
            <div class="sidebar-box">
                <img class="icon-img" src="./icons/messages.svg" alt="Home Icon">
                <div class="sidebar-label">Messages</div>
            </div>
            <div class="sidebar-box">
                <img class="icon-img" src="./icons/history.svg" alt="Home Icon">
                <div class="sidebar-label">History</div>
            </div>
            <div class="sidebar-box">
                <img class="icon-img" src="./icons/tasks.svg" alt="Home Icon">
                <div class="sidebar-label">Tasks</div>
            </div>
            <div class="sidebar-box">
                <img class="icon-img" src="./icons/groups.svg" alt="Home Icon">
                <div class="sidebar-label">Communities</div>
            </div>
            <div class="sidebar-box" style="margin-top: 50px;">
                <img class="icon-img" src="./icons/settings.svg" alt="Home Icon">
                <div class="sidebar-label">Settings</div>
            </div>
            <div class="sidebar-box">
                <img class="icon-img" src="./icons/support.svg" alt="Home Icon">
                <div class="sidebar-label">Support</div>
            </div>
            <div class="sidebar-box">
                <img class="icon-img" src="./icons/privacy.svg" alt="Home Icon">
                <div class="sidebar-label">Privacy</div>
            </div>
        </div>

        <div class="header-container"> head</div>

        <div class="content-container"> content</div>
    </div>
    

</body>
</html>
